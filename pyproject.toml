[project]
name = "filseg"
version = "1.0.0"
description = "Solar filament instance segmentation pipeline (Kaggle: filament-segmentation-2026)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "opencv-python-headless>=4.10",
    "pycocotools>=2.0.8",
    "scipy>=1.13",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "tqdm>=4.66",
    "matplotlib>=3.9",
    "kaggle>=1.7",
    "lightgbm>=4.7.0",
]

[project.optional-dependencies]
# Network stack (train / write-maps). PyPI torch wheels on Linux bundle CUDA, so the same lock
# works on a CPU laptop (slow) and on a GPU box.
train = [
    "torch>=2.5",
    "timm>=1.0.9",
    "segmentation-models-pytorch>=0.4",
]

[project.scripts]
filseg = "filseg.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "types-pyyaml>=6.0",
    "ipykernel>=6.29",
    "jupytext>=1.16",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filseg"]

[tool.ruff]
target-version = "py312"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "RUF"]
ignore = ["N803", "N806", "N812"]  # math-style names, `functional as F`

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E501"]  # markdown cells

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["train: tests that need the [train] extra (torch)"]
filterwarnings = ["ignore::DeprecationWarning:pycocotools.*"]
